{% extends "base.html" %}

{% block title %}ShipLog - Nuevo Log{% endblock %}

{% block content %}
    <div class="card">
        <div class="card-header">
            <h4 class="mb-0">
                <i class="fas fa-plus-circle"></i> Crear Nuevo Log
            </h4>
        </div>
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="title" class="form-label">
                        <i class="fas fa-heading"></i> Título
                    </label>
                    <input type="text" class="form-control" id="title" name="title" required
                           placeholder="Ej: Avance en el diseño de la interfaz">
                </div>
                
                <div class="mb-3">
                    <label for="content" class="form-label">
                        <i class="fas fa-align-left"></i> Contenido
                    </label>
                    <textarea class="form-control" id="content" name="content" rows="6" required
                              placeholder="Describe qué avanzaste hoy..."></textarea>
                </div>
                
                <div class="mb-3">
                    <label for="files" class="form-label">
                        <i class="fas fa-paperclip"></i> Archivos (opcional)
                    </label>
                    <input type="file" class="form-control" id="files" name="files" multiple
                           accept=".txt,.pdf,.png,.jpg,.jpeg,.gif,.doc,.docx,.xls,.xlsx,.zip">
                    <div class="form-text">
                        Puedes subir múltiples archivos. Formatos aceptados: TXT, PDF, imágenes, Word, Excel, ZIP. Máximo 16MB.
                    </div>
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar Log
                    </button>
                    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
