{% extends "base.html" %}

{% block title %}ShipLog - Registrarse{% endblock %}

{% block content %}
    <div class="card mx-auto" style="max-width: 400px;">
        <div class="card-header text-center">
            <h4 class="mb-0">
                <i class="fas fa-anchor"></i> ShipLog
            </h4>
            <small class="text-white">Crear Cuenta</small>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label for="name_employee" class="form-label">
                        <i class="fas fa-id-card"></i> Nombre Completo
                    </label>
                    <input type="text" class="form-control" id="name_employee" name="name_employee" required
                           placeholder="Ingresa tu nombre completo">
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label">
                        <i class="fas fa-user"></i> Usuario
                    </label>
                    <input type="text" class="form-control" id="username" name="username" required
                           placeholder="Elige un nombre de usuario">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock"></i> Contraseña
                    </label>
                    <input type="password" class="form-control" id="password" name="password" required
                           placeholder="Elige una contraseña">
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    <i class="fas fa-user-plus"></i> Registrarse
                </button>
            </form>
            
            <div class="text-center mt-3">
                <p class="mb-0">¿Ya tienes cuenta? 
                    <a href="{{ url_for('login') }}" class="text-decoration-none">Inicia sesión aquí</a>
                </p>
            </div>
        </div>
    </div>
{% endblock %}
