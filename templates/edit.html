{% extends "base.html" %}

{% block title %}ShipLog - Editar Actividad{% endblock %}

{% block content %}
    <div class="card">
        <div class="card-header">
            <h4 class="mb-0">
                <i class="fas fa-edit"></i> Editar Actividad
            </h4>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label for="title" class="form-label">
                        <i class="fas fa-heading"></i> Título
                    </label>
                    <input type="text" class="form-control" id="title" name="title" required
                           value="{{ actividad.title }}"
                           placeholder="Ej: Avance en el diseño de la interfaz">
                </div>

                <div class="mb-3">
                    <label for="content" class="form-label">
                        <i class="fas fa-align-left"></i> Contenido
                    </label>
                    <textarea class="form-control" id="content" name="content" rows="6" required
                              placeholder="Describe qué avanzaste hoy...">{{ actividad.content }}</textarea>
                </div>

                <div class="mb-3">
                    <label for="fecha" class="form-label">
                        <i class="fas fa-calendar"></i> Fecha
                    </label>
                    <input type="date" class="form-control" id="fecha" name="fecha"
                           value="{{ actividad.dia.fecha.strftime('%Y-%m-%d') }}">
                    <div class="form-text">
                        Selecciona la fecha de la actividad.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="tiempo" class="form-label">
                        <i class="fas fa-clock"></i> Tiempo (en minutos)
                    </label>
                    <input type="number" class="form-control" id="tiempo" name="tiempo" required min="1"
                           value="{{ actividad.tiempo }}"
                           placeholder="Ej: 30">
                    <div class="form-text">
                        Ingresa el tiempo que dedicaste a esta actividad en minutos.
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar Cambios
                    </button>
                    <a href="{{ url_for('view_dia', dia_id=actividad.dia_id) }}" class="btn btn-outline-secondary">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
