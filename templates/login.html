{% extends "base.html" %}

{% block title %}ShipLog - Iniciar Sesión{% endblock %}

{% block content %}
    <div class="card mx-auto" style="max-width: 400px;">
        <div class="card-header text-center">
            <h4 class="mb-0">
                <i class="fas fa-anchor"></i> ShipLog
            </h4>
            <small class="text-white">Iniciar Sesión</small>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">
                        <i class="fas fa-user"></i> Usuario
                    </label>
                    <input type="text" class="form-control" id="username" name="username" required
                           placeholder="Tu nombre de usuario">
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock"></i> Contraseña
                    </label>
                    <input type="password" class="form-control" id="password" name="password" required
                           placeholder="Tu contraseña">
                </div>
                
                <button type="submit" class="btn btn-primary w-100">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </button>
            </form>
            
            <div class="text-center mt-3">
                <a href="{{ url_for('forgot_password') }}" class="text-decoration-none d-block mb-2">
                    <i class="fas fa-key"></i> ¿Olvidaste tu contraseña?
                </a>
                <p class="mb-0">¿No tienes cuenta? 
                    <a href="{{ url_for('register') }}" class="text-decoration-none">Regístrate aquí</a>
                </p>
            </div>
        </div>
    </div>
{% endblock %}
